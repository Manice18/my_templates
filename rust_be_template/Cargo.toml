[workspace]
resolver = "3"
members = ["crates/api", "crates/db", "crates/shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace", "cors"] }

sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"], default-features = false }

anyhow = "1.0.102"
thiserror = "2.0.18"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
dotenvy = "0.15.7"

bcrypt = "0.17.1"
rand_core = { version = "0.9", features = ["os_rng"] }
base64 = "0.22.1"

utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
